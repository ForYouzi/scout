<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Scout app icon: compass on a teal-to-indigo tile. Source for `npm run client:icons:scout`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.55" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <circle cx="512" cy="512" r="268" fill="none" stroke="#ffffff" stroke-width="40"/>
  <g stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-opacity="0.85">
    <line x1="512" y1="290" x2="512" y2="320"/>
    <line x1="734" y1="512" x2="704" y2="512"/>
    <line x1="512" y1="734" x2="512" y2="704"/>
    <line x1="290" y1="512" x2="320" y2="512"/>
  </g>
  <polygon points="680,344 548,548 476,476" fill="#ffffff"/>
  <polygon points="344,680 476,476 548,548" fill="#99f6e4"/>
  <circle cx="512" cy="512" r="22" fill="#0e7490" stroke="#ffffff" stroke-width="12"/>
</svg>
