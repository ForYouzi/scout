[package]
name = "yaak-fonts"
links = "yaak-fonts"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
font-loader = "0.11.0"
fontdb = "0.24.0"
ttf-parser = "0.25.1"
tauri = { workspace = true, features = ["protocol-asset"] }
ts-rs = { workspace = true }
serde = "1.0"
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
tauri = { workspace = true, features = ["protocol-asset", "test"] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
