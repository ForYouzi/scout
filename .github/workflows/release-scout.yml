name: Release Scout

# Builds unsigned Scout installers for macOS, Windows and Linux and publishes them as a GitHub
# Release. Modeled on SonicTerm's release pipeline: every job that compiles or packages runs with a
# read-only token; only `publish` can write, and it only runs for a validated `scout-v*` tag.
#
# - Tag `scout-v2026.11.0` on a commit in main -> stable release.
# - Tag `scout-v2026.11.0-beta.1`             -> prerelease.
# - Pull requests touching Scout packaging    -> build-only dry run, nothing is published.
#
# Upstream `v*` tags (and their app/CLI release workflows) are never touched by this file.

on:
  push:
    tags: ["scout-v*"]
  pull_request:
    paths:
      - .github/workflows/release-scout.yml
      - crates-tauri/yaak-app-client/tauri.scout.conf.json
      - crates-tauri/yaak-app-client/scout.desktop
      - crates-tauri/yaak-app-client/icons/scout/**
      - crates-tauri/yaak-app-client/icons/scout.*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-scout-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCOUT_CONFIG: crates-tauri/yaak-app-client/tauri.scout.conf.json

jobs:
  validate:
    name: Validate release tag
    if: github.repository == 'ForYouzi/scout' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#scout-v}"
          num='(0|[1-9][0-9]*)'
          pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if [[ ! "$version" =~ ^$num\.$num\.$num(-$pre(\.$pre)*)?$ ]]; then
            echo "::error::Tag '$TAG' must look like scout-v1.2.3 or scout-v1.2.3-beta.1"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing Scout $version (prerelease: $prerelease)"

      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: validate
    # Runs for tags (after validate passes) and for PR / manual dry runs (validate is skipped).
    if: >-
      always() && github.repository == 'ForYouzi/scout' &&
      (needs.validate.result == 'success' || (github.event_name != 'push' && needs.validate.result == 'skipped'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Both macOS legs run on Intel runners and cross-compile with --target. GitHub's hosted
        # macOS arm64 pool is capacity-constrained and cancels jobs it cannot place ("not acquired
        # by Runner of type hosted"), which would leave a release without its macOS installers.
        include:
          - { os: macos, arch: aarch64, yaak_arch: arm64, runner: macos-15-intel, target: aarch64-apple-darwin, bundles: dmg }
          - { os: macos, arch: x64, yaak_arch: x64, runner: macos-15-intel, target: x86_64-apple-darwin, bundles: dmg }
          - { os: linux, arch: x86_64, yaak_arch: x64, runner: ubuntu-22.04, target: "", bundles: "deb,rpm,appimage" }
          - { os: linux, arch: aarch64, yaak_arch: arm64, runner: ubuntu-22.04-arm, target: "", bundles: "deb,rpm,appimage" }
          - { os: windows, arch: x64, yaak_arch: x64, runner: windows-latest, target: "", bundles: nsis }
          - { os: windows, arch: arm64, yaak_arch: arm64, runner: windows-latest, target: aarch64-pc-windows-msvc, bundles: nsis }
    defaults:
      run:
        shell: bash
    env:
      YAAK_TARGET_ARCH: ${{ matrix.yaak_arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        env:
          TAG_VERSION: ${{ needs.validate.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="${TAG_VERSION:-0.0.0-pr.${RUN_NUMBER}}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24"
          cache: true

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: scout-release-${{ matrix.os }}-${{ matrix.arch }}
          save-if: ${{ github.event_name == 'push' }}

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libnss3 patchelf xdg-utils
          # Same as release-app.yml: the sqlite wasm shim needs clang >= 18, which 22.04 lacks.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          echo "CC_wasm32_unknown_unknown=/usr/bin/clang-18" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=/usr/bin/llvm-ar-18" >> "$GITHUB_ENV"

      - name: Install Protoc for plugin-runtime
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: vp install
      - run: npm run bootstrap

      # Not `npm run replace-version`: it drops the first "v" anywhere in the string, which turns
      # "1.2.3-preview.1" into "1.2.3-preiew.1". The version here is already normalized.
      - name: Set version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "crates-tauri/yaak-app-client/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
            console.log("Version " + config.version);
          '

      # macOS keeps signing on so the overlay's ad-hoc identity ("-") seals the app before the dmg
      # is made; Apple Silicon refuses to launch fully unsigned downloads. Nothing in the Scout
      # overlay needs a secret. Linux and Windows build with --no-sign.
      - name: Build Scout
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          OS: ${{ matrix.os }}
        run: |
          args=(client --config "$SCOUT_CONFIG" --bundles "$BUNDLES")
          [[ -n "$TARGET" ]] && args+=(--target "$TARGET")
          [[ "$OS" != "macos" ]] && args+=(--no-sign)
          node scripts/run-build.mjs "${args[@]}"

      - name: Stage installers
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          mkdir -p scout-dist
          # Copies exactly one bundle matching the pattern to scout-dist/<name>; fails on zero or many.
          pick() {
            local kind="$1" pattern="$2" name="$3"
            # shellcheck disable=SC2206 # $pattern is a glob on purpose
            local files=(target/release/bundle/"$kind"/$pattern target/*/release/bundle/"$kind"/$pattern)
            if [[ ${#files[@]} -ne 1 ]]; then
              echo "::error::Expected one $kind/$pattern, found ${#files[@]}: ${files[*]}"
              exit 1
            fi
            cp "${files[0]}" "scout-dist/$name"
          }
          base="Scout_${VERSION}"
          case "$OS" in
            macos)
              pick dmg "*.dmg" "${base}_macos_${ARCH}.dmg" ;;
            linux)
              pick deb "*.deb" "${base}_linux_${ARCH}.deb"
              pick rpm "*.rpm" "${base}_linux_${ARCH}.rpm"
              pick appimage "*.AppImage" "${base}_linux_${ARCH}.AppImage" ;;
            windows)
              pick nsis "*-setup.exe" "${base}_windows_${ARCH}-setup.exe" ;;
          esac
          ls -la scout-dist

      - name: Verify macOS app inside the dmg
        if: matrix.os == 'macos'
        run: |
          mnt="$RUNNER_TEMP/scout-dmg"
          hdiutil attach scout-dist/*.dmg -nobrowse -readonly -mountpoint "$mnt"
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          app="$mnt/Scout.app"
          id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist")
          [[ "$id" == "io.github.foryouzi.scout" ]] || { echo "::error::Bundle id is $id"; exit 1; }
          [[ -x "$app/Contents/MacOS/scout" ]] || { echo "::error::Missing Contents/MacOS/scout"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature"

      - name: Verify Linux deb contents
        if: matrix.os == 'linux'
        run: |
          deb=(scout-dist/*.deb)
          dpkg-deb -c "${deb[0]}" | tee "$RUNNER_TEMP/deb.txt"
          # dpkg-deb -c lists paths with or without a leading "./" depending on how the deb was built.
          grep -qE " (\./)?usr/bin/scout$" "$RUNNER_TEMP/deb.txt" || { echo "::error::deb has no /usr/bin/scout"; exit 1; }
          if grep -q "yaak-app-client" "$RUNNER_TEMP/deb.txt"; then
            echo "::error::deb still installs yaak-app-client paths"; exit 1
          fi
          tmp="$RUNNER_TEMP/deb-x" && mkdir -p "$tmp" && dpkg-deb -x "${deb[0]}" "$tmp"
          grep -h "MimeType=x-scheme-handler/scout;" "$tmp"/usr/share/applications/*.desktop

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scout-${{ matrix.os }}-${{ matrix.arch }}
          path: scout-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    if: github.repository == 'ForYouzi/scout' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scout-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job with write access. It uploads the exact, checksummed asset set the read-only
    # build jobs produced.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scout-*
          path: artifacts

      # Each build artifact lands in its own folder; flattening here (not with merge-multiple)
      # means a file name produced by two builds fails instead of silently overwriting.
      - name: Collect installers
        run: |
          mkdir -p release
          while IFS= read -r -d '' f; do
            name=$(basename "$f")
            if [[ -e "release/$name" ]]; then
              echo "::error::$name was produced by more than one build"; exit 1
            fi
            cp "$f" "release/$name"
          done < <(find artifacts -type f -print0)

      - name: Check the asset set and write checksums
        working-directory: release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          base="Scout_${VERSION}"
          expected=(
            "${base}_macos_aarch64.dmg" "${base}_macos_x64.dmg"
            "${base}_windows_x64-setup.exe" "${base}_windows_arm64-setup.exe"
            "${base}_linux_x86_64.deb" "${base}_linux_x86_64.rpm" "${base}_linux_x86_64.AppImage"
            "${base}_linux_aarch64.deb" "${base}_linux_aarch64.rpm" "${base}_linux_aarch64.AppImage"
          )
          for f in "${expected[@]}"; do
            [[ -f "$f" ]] || { echo "::error::Missing asset $f"; exit 1; }
          done
          actual=$(find . -maxdepth 1 -type f | wc -l)
          if [[ "$actual" -ne "${#expected[@]}" ]]; then
            echo "::error::Expected ${#expected[@]} assets, found $actual"; ls -la; exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Scout $VERSION" --generate-notes)
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" release/*
